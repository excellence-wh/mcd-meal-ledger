# mypy 配置
#
# 与 ruff.toml 一样，放进仓库是为了让类型检查**可复现**：
# 评审核验者执行同一条命令能得到与作者完全一致的结果。
#
#   mypy mcledger scripts
#
# 注意：mypy / ruff 只是**开发期**工具，不属于项目运行时依赖。
# 本项目的运行时依赖依然是 0 —— 只有 Python 标准库。

[mypy]
python_version = 3.10

# 严格但不自虐：打开真正有用的那几项。
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

# 渐进式严格度：逐个模块开启，避免一次性淹没在存量告警里。
# 核心包已全部通过 --strict 级别的关键检查，这里保持整体可维护。
disallow_untyped_defs = False
check_untyped_defs = True

# 本项目零第三方依赖，没有 stub 需要处理。
ignore_missing_imports = True
